services:
  - type: web
    name: nexo-assist
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: LLM_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_API_KEY
        sync: false
